version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: voyage-db
    environment:
      POSTGRES_DB: apirest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: @@SUPER16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voyage-network

  # Spring Boot REST API
  restapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voyage-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apirest
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: @@SUPER16
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
    ports:
      - "8080:8080"
    networks:
      - voyage-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  voyage-network:
    driver: bridge
